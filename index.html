<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App กระเป๋าเดินตาม (AI Cyber Tracker)</title>
    <!-- ใช้ไลบรารี COCO-SSD ที่เสถียรและเปิดติดชัวร์ 100% บนมือถือ -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #181818; color: white; margin: 0; padding: 12px; }
        #video-container { position: relative; width: 100%; max-width: 480px; margin: 10px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        video { width: 100%; height: auto; display: block; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; z-index: 10; }
        
        button, select, input { padding: 10px 12px; font-size: 15px; margin: 4px; border-radius: 6px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        input[type="text"] { width: 220px; text-align: center; background: #fff; color: #000; font-weight: bold; }
        
        .control-box { background: #262626; padding: 10px; border-radius: 8px; max-width: 480px; margin: 8px auto; }
        .test-btns button { background: #444; padding: 6px 10px; font-size: 13px; }
        
        #status { font-size: 15px; color: #4caf50; margin: 5px 0; }
        #command-status { font-size: 26px; font-weight: bold; color: #ffeb3b; margin: 5px 0; background: #000; padding: 8px; border-radius: 8px; display: inline-block; min-width: 260px; }
        #debug-info { font-size: 13px; color: #00e5ff; margin-top: 4px; }
        label { font-size: 14px; cursor: pointer; user-select: none; display: inline-block; margin-top: 6px; color: #ddd; }
    </style>
</head>
<body>
    <h3 style="margin: 5px 0;">AI Luggage Tracker (Skeleton UI)</h3>
    
    <div class="control-box">
        <div>
            IP บอร์ด: <input type="text" id="espIpInput" value="192.168.137.247" placeholder="ใส่ IP ของ ESP32">
        </div>
        <div class="test-btns" style="margin-top: 6px;">
            <span>กดเทส: </span>
            <button onclick="sendCommand('F', true)">เดินหน้า (F)</button>
            <button onclick="sendCommand('L', true)">ซ้าย (L)</button>
            <button onclick="sendCommand('R', true)">ขวา (R)</button>
            <button onclick="sendCommand('S', true)" style="background:#d9534f;">หยุด (S)</button>
        </div>
        <div>
            <label>
                <input type="checkbox" id="invertLrCheck"> สลับทิศ ซ้าย-ขวา (ติ๊กเมื่อเลี้ยวสลับฝั่ง)
            </label>
        </div>
    </div>

    <select id="cameraSelect"><option value="">-- กำลังค้นหากล้อง --</option></select>
    <button id="startAiBtn">เปิดกล้องและ AI</button>
    
    <div id="status">สถานะ: รอเปิดกล้อง</div>
    <div id="command-status">คำสั่ง: S (หยุด)</div>
    <div id="debug-info">พิกัด: รอตรวจจับคน...</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let model = null;
        let safetyTimer = null;
        let lastCommand = '';
        let lastSendTime = 0;
        let isDetecting = false;
        let lastTargetX = null;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startAiBtn = document.getElementById('startAiBtn');
        const espIpInput = document.getElementById('espIpInput');
        const cmdStatusDiv = document.getElementById('command-status');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug-info');
        const cameraSelect = document.getElementById('cameraSelect');
        const invertLrCheck = document.getElementById('invertLrCheck');

        // 1. ค้นหากล้อง
        window.addEventListener('load', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    cameraSelect.innerHTML = '<option value="">เบราว์เซอร์ไม่รองรับกล้อง</option>';
                    return;
                }
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                cameraSelect.innerHTML = videoDevices.length ? '' : '<option value="">ไม่พบกล้อง</option>';
                videoDevices.forEach((d, i) => {
                    cameraSelect.add(new Option(d.label || `กล้องตัวที่ ${i+1}`, d.deviceId));
                });
            } catch (err) {
                cameraSelect.innerHTML = '<option value="">โหลดกล้องไม่สำเร็จ</option>';
            }
        });

        // 2. ส่งคำสั่งไป ESP32 และแสดงผลชัดเจน
        function sendCommand(cmd, isManual = false) {
            // ถ้าติ๊กสลับซ้ายขวา ให้กลับคำสั่ง L กับ R อัตโนมัติ (ยกเว้นตอนกดปุ่มเทสเอง)
            let finalCmd = cmd;
            if (!isManual && invertLrCheck.checked) {
                if (cmd === 'L') finalCmd = 'R';
                else if (cmd === 'R') finalCmd = 'L';
            }

            const now = Date.now();
            const cmdNames = {
                'F': '⬆️ F (เดินหน้า)',
                'L': '⬅️ L (เลี้ยวซ้าย)',
                'R': '➡️ R (เลี้ยวขวา)',
                'S': '🛑 S (หยุด)'
            };

            // อัปเดตข้อความบนหน้าจอทุกครั้งทันที
            cmdStatusDiv.innerText = "คำสั่ง: " + (cmdNames[finalCmd] || finalCmd);
            cmdStatusDiv.style.color = finalCmd === 'S' ? '#ff5252' : (finalCmd === 'F' ? '#00e676' : '#ffeb3b');

            // ป้องกันการยิง Wi-Fi ถี่เกินไปจนบอร์ดค้าง (ส่งเมื่อเปลี่ยนคำสั่ง หรือทุกๆ 400ms)
            if (!isManual && finalCmd === lastCommand && (now - lastSendTime < 400)) return;
            lastCommand = finalCmd;
            lastSendTime = now;

            const ip = espIpInput.value.trim();
            if (!ip) return;

            const url = `http://${ip}/${finalCmd}?t=${now}`;
            fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
            
            const img = new Image();
            img.src = url;
        }

        // 3. ฟังก์ชันวาดป้ายแท็กและโครงกระดูกแบบในรูปตัวอย่าง
        function drawCyberSkeleton(ctx, x, y, w, h, score) {
            const pct = Math.round(score * 100);

            // วาดพื้นหลังโปร่งแสงในกรอบตัวคน
            ctx.fillStyle = "rgba(0, 255, 204, 0.08)";
            ctx.fillRect(x, y, w, h);

            // วาดกรอบนอกสีเขียวมิ้นท์
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);

            // วาดป้าย Tag: body
            ctx.fillStyle = "rgba(30, 35, 45, 0.85)";
            ctx.fillRect(x, Math.max(0, y - 28), 95, 26);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText(`body : ${pct}`, x + 8, Math.max(18, y - 10));

            // คำนวณสัดส่วนจุดข้อต่อจำลองตามสรีระ
            const cx = x + w * 0.5;
            const headY = y + h * 0.12;
            const neckY = y + h * 0.22;
            const shoulderL = { x: x + w * 0.28, y: neckY };
            const shoulderR = { x: x + w * 0.72, y: neckY };
            const elbowL = { x: x + w * 0.16, y: y + h * 0.42 };
            const elbowR = { x: x + w * 0.84, y: y + h * 0.42 };
            const handL = { x: x + w * 0.12, y: y + h * 0.56 };
            const handR = { x: x + w * 0.88, y: y + h * 0.56 };
            const hipL = { x: x + w * 0.35, y: y + h * 0.55 };
            const hipR = { x: x + w * 0.65, y: y + h * 0.55 };
            const kneeL = { x: x + w * 0.32, y: y + h * 0.76 };
            const kneeR = { x: x + w * 0.68, y: y + h * 0.76 };
            const footL = { x: x + w * 0.28, y: y + h * 0.95 };
            const footR = { x: x + w * 0.72, y: y + h * 0.95 };

            // กรอบ Head / Face
            const headW = w * 0.28;
            const headH = h * 0.16;
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - headW/2, y + h*0.03, headW, headH);
            ctx.fillStyle = "rgba(30, 35, 45, 0.85)";
            ctx.fillRect(cx - headW/2, Math.max(0, y + h*0.03 - 24), 85, 22);
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px sans-serif";
            ctx.fillText(`face : ${pct}`, cx - headW/2 + 6, Math.max(15, y + h*0.03 - 9));

            // กรอบ Hand
            ctx.strokeRect(handR.x - 18, handR.y - 18, 36, 36);
            ctx.fillStyle = "rgba(30, 35, 45, 0.85)";
            ctx.fillRect(handR.x - 35, handR.y - 42, 75, 22);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(`hand`, handR.x - 18, handR.y - 27);

            // ฟังก์ชันวาดเส้นกระดูกแยกสีตามรูปตัวอย่าง
            function drawBone(p1, p2, color) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // วาดโครงกระดูกลำตัว (สีฟ้าอมเขียว)
            drawBone(shoulderL, shoulderR, "#00ffff");
            drawBone(shoulderL, hipL, "#00ffff");
            drawBone(shoulderR, hipR, "#00ffff");
            drawBone(hipL, hipR, "#00ffff");
            drawBone({x: cx, y: headY}, shoulderL, "#ffcc00");
            drawBone({x: cx, y: headY}, shoulderR, "#00ffff");

            // วาดแขนซ้าย-ขวา (สีแดง/ส้ม และ น้ำเงิน/ฟ้า)
            drawBone(shoulderL, elbowL, "#ff3300");
            drawBone(elbowL, handL, "#ff9900");
            drawBone(shoulderR, elbowR, "#0055ff");
            drawBone(elbowR, handR, "#00ccff");

            // วาดขาซ้าย-ขวา
            drawBone(hipL, kneeL, "#ff3300");
            drawBone(kneeL, footL, "#ff9900");
            drawBone(hipR, kneeR, "#0055ff");
            drawBone(kneeR, footR, "#00ffcc");

            // วาดจุดข้อต่อเรืองแสง (Keypoints)
            const joints = [
                {x: cx, y: headY}, {x: cx - 10, y: headY - 5}, {x: cx + 10, y: headY - 5},
                shoulderL, shoulderR, elbowL, elbowR, handL, handR,
                hipL, hipR, kneeL, kneeR, footL, footR
            ];
            joints.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#00ffff";
                ctx.stroke();
            });
        }

        // 4. เริ่มเปิดกล้องและโหลดโมเดล
        startAiBtn.addEventListener('click', async () => {
            const ip = espIpInput.value.trim();
            if (!ip) { alert("กรุณาใส่ IP ของ ESP32 ก่อนครับ!"); return; }
            
            startAiBtn.disabled = true;
            statusDiv.innerText = "กำลังเปิดกล้องและโหลดโมเดล AI...";
            
            const selectedCameraId = cameraSelect.value;
            const constraints = { 
                video: selectedCameraId 
                    ? { deviceId: { exact: selectedCameraId }, width: { ideal: 640 }, height: { ideal: 480 } }
                    : { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
            };

            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
                
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                };

                if (!model) {
                    model = await cocoSsd.load();
                }
                
                statusDiv.innerText = "ระบบพร้อม! กำลังแท็กและตามหาคน...";
                if (!isDetecting) { 
                    isDetecting = true; 
                    detectFrame(); 
                }
            } catch (err) {
                statusDiv.innerText = "Error: " + err.message;
                startAiBtn.disabled = false;
            }
        });

        // 5. ลูปตรวจจับและคำนวณทิศทางการเดิน
        async function detectFrame() {
            if (!video || video.readyState < 2 || !model) {
                requestAnimationFrame(detectFrame);
                return;
            }

            // ซิงค์ขนาด Canvas กับกล้องทุกเฟรมเพื่อป้องกันกรอบเพี้ยน
            if (video.videoWidth > 0 && canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            try {
                const predictions = await model.detect(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // วาดเส้นแบ่งโซนซ้าย (35%) - กลาง - ขวา (65%) บนหน้าจอ
                const leftZone = canvas.width * 0.35;
                const rightZone = canvas.width * 0.65;

                ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
                ctx.setLineDash([6, 6]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(leftZone, 0); ctx.lineTo(leftZone, canvas.height);
                ctx.moveTo(rightZone, 0); ctx.lineTo(rightZone, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = "rgba(255,255,255,0.5)";
                ctx.font = "12px sans-serif";
                ctx.fillText("<< โซนเลี้ยวซ้าย", 10, 20);
                ctx.fillText("โซนเดินหน้า", (canvas.width/2) - 30, 20);
                ctx.fillText("โซนเลี้ยวขวา >>", rightZone + 10, 20);

                // คัดกรองเฉพาะคน (ลดเกณฑ์ลงเหลือ 0.30 เพื่อให้แท็กติดง่ายและไวที่สุด)
                const persons = predictions.filter(p => p.class === 'person' && p.score > 0.30);

                if (persons.length > 0) {
                    // ล็อกเป้าหมายคนที่อยู่ใกล้ตำแหน่งเดิมที่สุด (หรือคนแรกหากเพิ่งเริ่ม)
                    let target = persons[0];
                    if (lastTargetX !== null && persons.length > 1) {
                        let minDiff = Infinity;
                        persons.forEach(p => {
                            const cx = p.bbox[0] + p.bbox[2] / 2;
                            const diff = Math.abs(cx - lastTargetX);
                            if (diff < minDiff) {
                                minDiff = diff;
                                target = p;
                            }
                        });
                    }

                    const [x, y, w, h] = target.bbox;
                    const centerX = x + (w / 2);
                    const centerY = y + (h / 2);
                    lastTargetX = centerX;

                    if (safetyTimer) {
                        clearTimeout(safetyTimer);
                        safetyTimer = null;
                    }

                    // วาดกรอบและโครงกระดูกแบบในรูปตัวอย่าง
                    drawCyberSkeleton(ctx, x, y, w, h, target.score);

                    // วาดจุดเล็งเป้าสีแดงตรงกลางตัวคน
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
                    ctx.fillStyle = "#ff0055";
                    ctx.fill();

                    // คำนวณสัดส่วนเพื่อสั่งเดิน (คิดเป็น % เทียบกับหน้าจอ)
                    const normX = centerX / canvas.width;
                    const areaRatio = (w * h) / (canvas.width * canvas.height);

                    debugDiv.innerText = `จุดกึ่งกลางคน: ${(normX * 100).toFixed(0)}% | ขนาดตัว: ${(areaRatio * 100).toFixed(0)}% ของจอ`;

                    // ตรรกะการสั่งงานมอเตอร์ที่ปรับให้แม่นยำขึ้น
                    if (normX < 0.35) {
                        sendCommand('L'); // จุดกลางตัวคนอยู่ในโซนซ้าย
                    } else if (normX > 0.65) {
                        sendCommand('R'); // จุดกลางตัวคนอยู่ในโซนขวา
                    } else {
                        // คนอยู่โซนตรงกลาง เช็คขนาดตัวว่าใกล้ชนหรือยัง
                        if (areaRatio > 0.70) {
                            sendCommand('S'); // ตัวใหญ่เกิน 70% ของจอ = ประชิดตัวแล้ว ให้หยุด
                        } else {
                            sendCommand('F'); // ระยะเดินตามปกติ สั่งเดินหน้าทันที!
                        }
                    }

                    // หากคนหลุดเฟรมไปเกิน 1 วินาที ให้สั่งหยุด
                    safetyTimer = setTimeout(() => {
                        sendCommand('S');
                        lastTargetX = null;
                    }, 1000);

                } else {
                    ctx.fillStyle = "rgba(255, 60, 60, 0.85)";
                    ctx.font = "bold 20px sans-serif";
                    ctx.fillText("ไม่พบคนในเฟรม", 20, 50);
                    debugDiv.innerText = "พิกัด: กำลังค้นหาคน...";
                    lastTargetX = null;
                }
            } catch (err) {
                console.warn("Frame skipped:", err);
            }
            
            requestAnimationFrame(detectFrame);
        }
    </script>
</body>
</html>
