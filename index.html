<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App กระเป๋าเดินตาม (Wi-Fi Mode)</title>
    <!-- โหลดไลบรารี AI จาก TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #222; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        
        /* --- แก้ไข CSS เพื่อแก้จอดำและปรับให้พอดีมือถือ --- */
        #video-container { 
            position: relative; 
            width: 100%; 
            max-width: 640px; /* จำกัดความกว้างไม่ให้ล้นจอบนคอมพิวเตอร์ */
            margin: 20px auto; 
        }
        video { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 10px; 
            background: #000; /* พื้นหลังสีดำเผื่อตอนกล้องยังไม่มา */
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; /* ยืดให้กว้างเท่า video */
            height: 100%; /* ยืดให้สูงเท่า video */
            background: transparent; /* สำคัญ: ทำให้โปร่งใส ไม่บังกล้อง */
            pointer-events: none; /* ให้แตะจอทะลุ canvas ได้ */
            z-index: 10;
        }
        /* ------------------------------------------- */

        button, select, input { padding: 12px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        input { width: 250px; text-align: center; }
        #status { margin-top: 15px; font-size: 18px; color: #4caf50; }
        #command-status { font-size: 24px; font-weight: bold; color: #ffeb3b; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>AI Luggage Tracker (Wi-Fi Mode)</h2>
    
    <div>
        <input type="text" id="espIpInput" placeholder="ใส่ IP ของ ESP32 เช่น 192.168.64.81">
    </div>
    <br>
    <select id="cameraSelect"><option value="">-- กำลังค้นหากล้อง --</option></select>
    <button id="startAiBtn">เปิดกล้องและ AI</button>
    
    <div id="status">สถานะ: รอเปิดกล้อง</div>
    <div id="command-status">คำสั่งปัจจุบัน: S (หยุด)</div>

    <!-- ลบ width/height ออก เพื่อให้ปรับขนาดตามจอมือถืออัตโนมัติ -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let model = null;
        let safetyTimer = null;
        let lastCommand = 'S';
        let isDetecting = false;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startAiBtn = document.getElementById('startAiBtn');
        const espIpInput = document.getElementById('espIpInput');
        const cmdStatusDiv = document.getElementById('command-status');
        const statusDiv = document.getElementById('status');
        const cameraSelect = document.getElementById('cameraSelect');

        // ดึงรายชื่อกล้องตอนเปิดเว็บ
        window.addEventListener('load', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    cameraSelect.innerHTML = '<option value="">เบราว์เซอร์ไม่รองรับกล้อง</option>';
                    return;
                }
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                cameraSelect.innerHTML = videoDevices.length ? '' : '<option value="">ไม่พบกล้อง</option>';
                videoDevices.forEach((d, i) => {
                    cameraSelect.add(new Option(d.label || `กล้องตัวที่ ${i+1}`, d.deviceId));
                });
            } catch (err) {
                console.error("Error loading cameras:", err);
                cameraSelect.innerHTML = '<option value="">เกิดข้อผิดพลาดในการโหลดกล้อง</option>';
            }
        });

        // ฟังก์ชันส่งคำสั่ง Wi-Fi ไปหา ESP32
        async function sendCommand(cmd) {
            if (cmd === lastCommand) return;
            lastCommand = cmd;
            cmdStatusDiv.innerText = "คำสั่งปัจจุบัน: " + cmd;
            
            const ip = espIpInput.value.trim();
            if (ip) {
                try {
                    fetch(`http://${ip}/${cmd}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
                } catch(e) {}
            }
        }

        // เริ่มเปิดกล้องและ AI
        startAiBtn.addEventListener('click', async () => {
            const ip = espIpInput.value.trim();
            if (!ip) { 
                alert("กรุณาใส่ IP ของ ESP32 ในช่องด้านบนก่อนครับ!"); 
                return; 
            }
            
            startAiBtn.disabled = true;
            statusDiv.innerText = "กำลังโหลดโมเดล AI...";
            
            const selectedCameraId = cameraSelect.value;
            const constraints = { 
                video: selectedCameraId 
                    ? { deviceId: { exact: selectedCameraId }, width: { ideal: 640 }, height: { ideal: 480 } }
                    : { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
            };

            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
                
                // --- ซิงค์ความละเอียดวิดีโอกับ Canvas ให้ตรงกันเพื่อไม่ให้กรอบเขียวลอย ---
                video.onloadedmetadata = () => {
                    video.width = video.videoWidth;
                    video.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };

                if (!model) {
                    model = await cocoSsd.load();
                }
                statusDiv.innerText = "ระบบพร้อม! กำลังตามหาคน...";
                if (!isDetecting) { 
                    isDetecting = true; 
                    detectFrame(); 
                }
            } catch (err) {
                console.error("Camera Error:", err);
                statusDiv.innerText = "Error: " + err.message;
                startAiBtn.disabled = false;
            }
        });

        // วนลูปประมวลผลภาพหาคน
        async function detectFrame() {
            if (!video || video.readyState !== 4 || !model) {
                requestAnimationFrame(detectFrame);
                return;
            }

            try {
                const predictions = await model.detect(video);
                
                let person = null;
                if (predictions && Array.isArray(predictions)) {
                    person = predictions.find(p => p.class === 'person' && p.score > 0.60);
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (person && person.bbox && Array.isArray(person.bbox)) {
                    if (safetyTimer) {
                        clearTimeout(safetyTimer);
                        safetyTimer = null;
                    }

                    const [x, y, w, h] = person.bbox;
                    ctx.strokeStyle = "#00FF00"; 
                    ctx.lineWidth = 4; 
                    ctx.strokeRect(x, y, w, h);
                    
                    const normalizedX = (x + (w / 2)) / canvas.width;
                    const normalizedW = w / canvas.width;

                    // เงื่อนไขสั่งเลี้ยวและเดิน
                    if (normalizedX < 0.35) sendCommand('L'); // คนอยู่ซ้าย
                    else if (normalizedX > 0.65) sendCommand('R'); // คนอยู่ขวา
                    else if (normalizedW > 0.6 || normalizedW < 0.15) sendCommand('S'); // คนอยู่ใกล้ไปหรือไกลไป
                    else sendCommand('F'); // คนอยู่ตรงกลางและระยะพอดี

                    // หากหยุดหาคนเจอเกิน 1 วินาที ให้สั่งหยุดเพื่อความปลอดภัย
                    safetyTimer = setTimeout(() => sendCommand('S'), 1000);
                } else {
                    ctx.fillStyle = "rgba(255,0,0,0.5)"; 
                    ctx.font = "20px sans-serif";
                    ctx.fillText("ไม่พบเป้าหมาย", 20, 40);
                }
            } catch (err) {
                console.warn("Detection skipped this frame:", err);
            }
            
            requestAnimationFrame(detectFrame);
        }
    </script>
</body>
</html>
