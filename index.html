<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App กระเป๋าเดินตาม (Skeleton + Tracking)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 20px; }
        #video-container { position: relative; width: 100%; max-width: 640px; margin: 20px auto; }
        video { width: 100%; height: auto; display: block; border-radius: 10px; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; z-index: 10; }
        
        button, select, input { padding: 12px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        input { width: 250px; text-align: center; }
        #status { margin-top: 15px; font-size: 18px; color: #4caf50; }
        #command-status { font-size: 24px; font-weight: bold; color: #ffeb3b; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>AI Luggage Tracker (Smart Target)</h2>
    
    <div>
        <input type="text" id="espIpInput" placeholder="ใส่ IP ของ ESP32 เช่น 192.168.64.81">
    </div>
    <br>
    <select id="cameraSelect"><option value="">-- กำลังค้นหากล้อง --</option></select>
    <button id="startAiBtn">เปิดกล้องและ AI</button>
    
    <div id="status">สถานะ: รอเปิดกล้อง</div>
    <div id="command-status">คำสั่งปัจจุบัน: S (หยุด)</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let detector = null;
        let safetyTimer = null;
        let lastCommand = 'S';
        let isDetecting = false;
        
        let lastTargetCenter = null; 

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startAiBtn = document.getElementById('startAiBtn');
        const espIpInput = document.getElementById('espIpInput');
        const cmdStatusDiv = document.getElementById('command-status');
        const statusDiv = document.getElementById('status');
        const cameraSelect = document.getElementById('cameraSelect');

        window.addEventListener('load', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    cameraSelect.innerHTML = '<option value="">เบราว์เซอร์ไม่รองรับกล้อง</option>';
                    return;
                }
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                cameraSelect.innerHTML = videoDevices.length ? '' : '<option value="">ไม่พบกล้อง</option>';
                videoDevices.forEach((d, i) => {
                    cameraSelect.add(new Option(d.label || `กล้องตัวที่ ${i+1}`, d.deviceId));
                });
            } catch (err) {
                console.error("Error loading cameras:", err);
                cameraSelect.innerHTML = '<option value="">เกิดข้อผิดพลาดในการโหลดกล้อง</option>';
            }
        });

        async function sendCommand(cmd) {
            if (cmd === lastCommand) return;
            lastCommand = cmd;
            cmdStatusDiv.innerText = "คำสั่งปัจจุบัน: " + cmd;
            
            const ip = espIpInput.value.trim();
            if (ip) {
                try { 
                    fetch(`http://${ip}/${cmd}`, { method: 'GET', mode: 'no-cors' }).catch(() => {}); 
                } catch(e) {}
            }
        }

        startAiBtn.addEventListener('click', async () => {
            const ip = espIpInput.value.trim();
            if (!ip) { alert("กรุณาใส่ IP ของ ESP32 ในช่องด้านบนก่อนครับ!"); return; }
            
            startAiBtn.disabled = true;
            statusDiv.innerText = "กำลังโหลดโมเดลโครงกระดูก...";
            
            const selectedCameraId = cameraSelect.value;
            const constraints = { 
                video: selectedCameraId 
                    ? { deviceId: { exact: selectedCameraId }, width: { ideal: 640 }, height: { ideal: 480 } }
                    : { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
            };

            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
                
                video.onloadedmetadata = () => {
                    video.width = video.videoWidth;
                    video.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };

                if (!detector) {
                    const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
                    detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);
                }
                
                statusDiv.innerText = "ระบบพร้อม! กำลังตามหาคน...";
                if (!isDetecting) { 
                    isDetecting = true; 
                    detectFrame(); 
                }
            } catch (err) {
                statusDiv.innerText = "Error: " + err.message;
                startAiBtn.disabled = false;
            }
        });

        async function detectFrame() {
            if (!video || video.readyState !== 4 || !detector) {
                requestAnimationFrame(detectFrame);
                return;
            }

            try {
                const poses = await detector.estimatePoses(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (poses && poses.length > 0) {
                    let targetPose = null;

                    if (!lastTargetCenter) {
                        targetPose = poses[0]; 
                    } else {
                        let minDistance = Infinity;
                        for (let pose of poses) {
                            if (!pose.box) continue;
                            const centerX = pose.box.xMin + (pose.box.width / 2);
                            const centerY = pose.box.yMin + (pose.box.height / 2);
                            const distance = Math.hypot(centerX - lastTargetCenter.x, centerY - lastTargetCenter.y);
                            
                            if (distance < minDistance) {
                                minDistance = distance;
                                targetPose = pose;
                            }
                        }
                        
                        // แก้ไข 1: ใช้สัดส่วน 50% ของความกว้างจอ แทนตัวเลข 200 พิกเซล
                        if (minDistance > (canvas.width * 0.5)) {
                            targetPose = null;
                            lastTargetCenter = null;
                            sendCommand('S');
                        }
                    }

                    if (targetPose && targetPose.box) {
                        const x = targetPose.box.xMin;
                        const y = targetPose.box.yMin;
                        const w = targetPose.box.width;
                        const h = targetPose.box.height;

                        lastTargetCenter = { x: x + (w / 2), y: y + (h / 2) };
                        
                        if (safetyTimer) {
                            clearTimeout(safetyTimer);
                            safetyTimer = null;
                        }

                        const adjacentKeyPoints = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#00FFCC'; 
                        adjacentKeyPoints.forEach(([i, j]) => {
                            const kp1 = targetPose.keypoints[i];
                            const kp2 = targetPose.keypoints[j];
                            if (kp1.score > 0.35 && kp2.score > 0.35) { // ลดความเข้มงวดให้วาดเส้นง่ายขึ้น
                                ctx.beginPath();
                                ctx.moveTo(kp1.x, kp1.y);
                                ctx.lineTo(kp2.x, kp2.y);
                                ctx.stroke();
                            }
                        });

                        ctx.strokeStyle = "rgba(0, 255, 204, 0.7)"; 
                        ctx.lineWidth = 2; 
                        ctx.strokeRect(x, y, w, h);

                        const normalizedX = lastTargetCenter.x / canvas.width;
                        // แก้ไข 2: ใช้ความสูง (h) เทียบกับความสูงหน้าจอ (canvas.height) ในการคำนวณระยะ
                        const normalizedH = h / canvas.height; 

                        if (normalizedX < 0.35) {
                            sendCommand('L'); 
                        } else if (normalizedX > 0.65) {
                            sendCommand('R'); 
                        } else {
                            // คนอยู่ตรงกลาง เช็คว่าใกล้หรือไกลเกินไปไหม
                            if (normalizedH > 0.85) { 
                                sendCommand('S'); // ตัวใหญ่คับจอ = ใกล้เกินไป ให้หยุด
                            } else if (normalizedH < 0.20) { 
                                sendCommand('S'); // ตัวเล็กมาก = ไกลเกินไป ให้หยุดรอ
                            } else {
                                sendCommand('F'); // ระยะกำลังดี สั่งเดินหน้า!
                            }
                        }

                        safetyTimer = setTimeout(() => {
                            sendCommand('S');
                            lastTargetCenter = null;
                        }, 1000);
                    }

                } else {
                    ctx.fillStyle = "rgba(255,0,0,0.5)"; 
                    ctx.font = "20px sans-serif";
                    ctx.fillText("ไม่พบเป้าหมาย", 20, 40);
                    lastTargetCenter = null;
                }
            } catch (err) {
                console.warn("Detection skipped this frame:", err);
            }
            
            requestAnimationFrame(detectFrame);
        }
    </script>
</body>
</html>
