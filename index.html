<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App กระเป๋าเดินตาม (Skeleton + ESP32)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 15px; }
        #video-container { position: relative; width: 100%; max-width: 500px; margin: 15px auto; }
        video { width: 100%; height: auto; display: block; border-radius: 12px; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; z-index: 10; }
        
        button, select, input { padding: 10px 14px; font-size: 16px; margin: 4px; border-radius: 6px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:active { transform: scale(0.97); }
        button:disabled { background: #555; cursor: not-allowed; }
        input { width: 240px; text-align: center; background: #fff; color: #000; font-weight: bold; }
        
        .test-btns button { background: #444; padding: 8px 12px; font-size: 14px; }
        #status { margin-top: 10px; font-size: 16px; color: #4caf50; }
        #command-status { font-size: 26px; font-weight: bold; color: #ffeb3b; margin: 8px 0; }
        #debug-info { font-size: 13px; color: #aaa; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>AI Luggage Tracker</h2>
    
    <div>
        <input type="text" id="espIpInput" value="192.168.137.247" placeholder="ใส่ IP ของ ESP32">
    </div>

    <!-- ปุ่มกดทดสอบส่งคำสั่งเข้าบอร์ด ESP32 โดยตรง -->
    <div class="test-btns">
        <span>ทดสอบบอร์ด: </span>
        <button onclick="sendCommand('F', true)">เดินหน้า (F)</button>
        <button onclick="sendCommand('L', true)">ซ้าย (L)</button>
        <button onclick="sendCommand('R', true)">ขวา (R)</button>
        <button onclick="sendCommand('S', true)" style="background:#d9534f;">หยุด (S)</button>
    </div>

    <select id="cameraSelect"><option value="">-- กำลังค้นหากล้อง --</option></select>
    <button id="startAiBtn">เปิดกล้องและ AI</button>
    
    <div id="status">สถานะ: รอเปิดกล้อง</div>
    <div id="command-status">คำสั่งปัจจุบัน: S</div>
    <div id="debug-info">พิกัด: รอตรวจจับคน...</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let detector = null;
        let safetyTimer = null;
        let lastCommand = '';
        let lastSendTime = 0;
        let isDetecting = false;
        let lastTargetCenter = null;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startAiBtn = document.getElementById('startAiBtn');
        const espIpInput = document.getElementById('espIpInput');
        const cmdStatusDiv = document.getElementById('command-status');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug-info');
        const cameraSelect = document.getElementById('cameraSelect');

        // 1. โหลดรายการกล้อง
        window.addEventListener('load', async () => {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    cameraSelect.innerHTML = '<option value="">เบราว์เซอร์ไม่รองรับกล้อง</option>';
                    return;
                }
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                cameraSelect.innerHTML = videoDevices.length ? '' : '<option value="">ไม่พบกล้อง</option>';
                videoDevices.forEach((d, i) => {
                    cameraSelect.add(new Option(d.label || `กล้องตัวที่ ${i+1}`, d.deviceId));
                });
            } catch (err) {
                cameraSelect.innerHTML = '<option value="">โหลดกล้องไม่สำเร็จ</option>';
            }
        });

        // 2. ฟังก์ชันส่งคำสั่งไปหาบอร์ด ESP32 ผ่าน Wi-Fi
        function sendCommand(cmd, force = false) {
            const now = Date.now();
            // ส่งซ้ำเมื่อคำสั่งเปลี่ยน หรือผ่านไปทุกๆ 500 มิลลิวินาที เพื่อย้ำให้บอร์ดทำงานต่อเนื่อง
            if (!force && cmd === lastCommand && (now - lastSendTime < 500)) return;
            
            lastCommand = cmd;
            lastSendTime = now;

            const cmdName = { 'F': 'F (เดินหน้า)', 'L': 'L (เลี้ยวซ้าย)', 'R': 'R (เลี้ยวขวา)', 'S': 'S (หยุด)' };
            cmdStatusDiv.innerText = "คำสั่งปัจจุบัน: " + (cmdName[cmd] || cmd);
            cmdStatusDiv.style.color = cmd === 'S' ? '#ff5252' : '#00e676';

            const ip = espIpInput.value.trim();
            if (!ip) return;

            const targetUrl = `http://${ip}/${cmd}?t=${now}`;

            // ส่งผ่าน Fetch (no-cors)
            fetch(targetUrl, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});

            // ส่งสำรองผ่าน Image ping (ช่วยให้ทะลุการบล็อกบางกรณีบนมือถือได้ดีขึ้น)
            const img = new Image();
            img.src = targetUrl;
        }

        // 3. คำนวณกรอบสี่เหลี่ยม (Bounding Box) จากจุดข้อต่อร่างกาย
        function getBoundingBoxFromKeypoints(keypoints) {
            const validPoints = keypoints.filter(kp => kp.score > 0.30);
            if (validPoints.length < 3) return null; // ต้องเห็นอย่างน้อย 3 จุดของร่างกาย

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            validPoints.forEach(kp => {
                if (kp.x < minX) minX = kp.x;
                if (kp.y < minY) minY = kp.y;
                if (kp.x > maxX) maxX = kp.x;
                if (kp.y > maxY) maxY = kp.y;
            });

            // ขยายกรอบออกเล็กน้อยให้ครอบคลุมลำตัวเหมือนในภาพตัวอย่าง
            const padX = (maxX - minX) * 0.15 + 15;
            const padY = (maxY - minY) * 0.10 + 15;

            const x = Math.max(0, minX - padX);
            const y = Math.max(0, minY - padY);
            const w = Math.min(canvas.width - x, (maxX - minX) + padX * 2);
            const h = Math.min(canvas.height - y, (maxY - minY) + padY * 2);

            return { x, y, w, h, centerX: x + (w / 2), centerY: y + (h / 2) };
        }

        // 4. เริ่มเปิดกล้องและโหลดโมเดล
        startAiBtn.addEventListener('click', async () => {
            const ip = espIpInput.value.trim();
            if (!ip) { alert("กรุณาใส่ IP ของ ESP32 ก่อนครับ!"); return; }
            
            startAiBtn.disabled = true;
            statusDiv.innerText = "กำลังโหลดโมเดล AI...";
            
            const selectedCameraId = cameraSelect.value;
            const constraints = { 
                video: selectedCameraId 
                    ? { deviceId: { exact: selectedCameraId }, width: { ideal: 640 }, height: { ideal: 480 } }
                    : { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
            };

            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
                
                video.onloadedmetadata = () => {
                    video.width = video.videoWidth;
                    video.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };

                if (!detector) {
                    const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
                    detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);
                }
                
                statusDiv.innerText = "ระบบพร้อม! กำลังตามหาคน...";
                if (!isDetecting) { 
                    isDetecting = true; 
                    detectFrame(); 
                }
            } catch (err) {
                statusDiv.innerText = "Error: " + err.message;
                startAiBtn.disabled = false;
            }
        });

        // 5. ลูปตรวจจับคน วาดกรอบ และสั่งงานมอเตอร์
        async function detectFrame() {
            if (!video || video.readyState !== 4 || !detector) {
                requestAnimationFrame(detectFrame);
                return;
            }

            try {
                const poses = await detector.estimatePoses(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // วาดเส้นแบ่งโซนซ้าย-กลาง-ขวา จางๆ บนหน้าจอเพื่อดูแนวเลี้ยว
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.35, 0); ctx.lineTo(canvas.width * 0.35, canvas.height);
                ctx.moveTo(canvas.width * 0.65, 0); ctx.lineTo(canvas.width * 0.65, canvas.height);
                ctx.stroke();

                if (poses && poses.length > 0) {
                    const pose = poses[0];
                    const box = getBoundingBoxFromKeypoints(pose.keypoints);

                    if (box) {
                        // ระบบป้องกันการสลับเป้าหมายกระทันหัน
                        if (lastTargetCenter) {
                            const dist = Math.hypot(box.centerX - lastTargetCenter.x, box.centerY - lastTargetCenter.y);
                            if (dist > canvas.width * 0.65) {
                                // ถ้ากระโดดไกลเกิน 65% ของจอ ให้รีเซ็ตและหยุดก่อน 1 เฟรม
                                lastTargetCenter = null;
                                sendCommand('S');
                                requestAnimationFrame(detectFrame);
                                return;
                            }
                        }
                        lastTargetCenter = { x: box.centerX, y: box.centerY };

                        if (safetyTimer) {
                            clearTimeout(safetyTimer);
                            safetyTimer = null;
                        }

                        // 1. วาดกรอบสี่เหลี่ยมรอบตัวคน (Bounding Box) พร้อมป้ายแท็ก
                        ctx.strokeStyle = "#00FFCC";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(box.x, box.y, box.w, box.h);

                        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                        ctx.fillRect(box.x, Math.max(0, box.y - 28), 110, 26);
                        ctx.fillStyle = "#00FFCC";
                        ctx.font = "bold 15px sans-serif";
                        ctx.fillText("TARGET: ON", box.x + 8, Math.max(18, box.y - 10));

                        // 2. วาดเส้นโครงกระดูก (Skeleton)
                        const adjacentPairs = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = "#00E5FF";
                        adjacentPairs.forEach(([i, j]) => {
                            const kp1 = pose.keypoints[i];
                            const kp2 = pose.keypoints[j];
                            if (kp1.score > 0.30 && kp2.score > 0.30) {
                                ctx.beginPath();
                                ctx.moveTo(kp1.x, kp1.y);
                                ctx.lineTo(kp2.x, kp2.y);
                                ctx.stroke();
                            }
                        });

                        // 3. วาดจุดข้อต่อ (Keypoints)
                        ctx.fillStyle = "#FFFFFF";
                        pose.keypoints.forEach(kp => {
                            if (kp.score > 0.30) {
                                ctx.beginPath();
                                ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
                                ctx.fill();
                            }
                        });

                        // 4. คำนวณทิศทางและส่งคำสั่งไป ESP32
                        const normalizedX = box.centerX / canvas.width;
                        const normalizedH = box.h / canvas.height;

                        debugDiv.innerText = `ตำแหน่งซ้าย-ขวา: ${(normalizedX * 100).toFixed(0)}% | ขนาดตัว: ${(normalizedH * 100).toFixed(0)}%`;

                        if (normalizedX < 0.35) {
                            sendCommand('L'); // คนอยู่ฝั่งซ้าย
                        } else if (normalizedX > 0.65) {
                            sendCommand('R'); // คนอยู่ฝั่งขวา
                        } else {
                            // คนอยู่ตรงกลาง เช็คระยะใกล้-ไกลจากความสูงของกรอบ
                            if (normalizedH > 0.90) {
                                sendCommand('S'); // ใกล้มาก (เต็มจอเกิน 90%) ให้หยุดป้องกันชน
                            } else if (normalizedH < 0.12) {
                                sendCommand('S'); // ไกลเกินไป ให้หยุด
                            } else {
                                sendCommand('F'); // ระยะปกติ สั่งเดินหน้า
                            }
                        }

                        // หากคนหายไปจากจอเกิน 1 วินาที ให้สั่งหยุดทันที
                        safetyTimer = setTimeout(() => {
                            sendCommand('S');
                            lastTargetCenter = null;
                        }, 1000);

                    } else {
                        debugDiv.innerText = "พิกัด: เห็นคนไม่ชัดเจน (จุดข้อต่อน้อยเกินไป)";
                        sendCommand('S');
                    }
                } else {
                    ctx.fillStyle = "rgba(255, 82, 82, 0.8)";
                    ctx.font = "bold 20px sans-serif";
                    ctx.fillText("ไม่พบเป้าหมาย", 20, 40);
                    debugDiv.innerText = "พิกัด: รอตรวจจับคน...";
                    lastTargetCenter = null;
                }
            } catch (err) {
                console.warn("Detection error:", err);
            }
            
            requestAnimationFrame(detectFrame);
        }
    </script>
</body>
</html>
